[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genealogy-compatibility-workbench"
version = "0.1.0"
description = "Scientific source-preserving exact and conditional finite-catalogue genealogy sorter"
requires-python = ">=3.10"

[project.optional-dependencies]
sequence = ["biopython==1.88"]

[project.scripts]
genealogy-workbench = "genealogy_workbench.cli:main"

[tool.setuptools.packages.find]
include = ["genealogy_workbench*"]

[tool.setuptools.package-data]
genealogy_workbench = ["provenance-registry.json"]
