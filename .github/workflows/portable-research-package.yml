name: Portable research package
on:
  push:
    branches: [codex/portable-lean-rust-registry-20261023]
    paths:
      - 'packages/research/**'
      - '.github/workflows/portable-research-package.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust:
    name: Exact Rust engines and source assembly (not full claim closure)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/research
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          sparse-checkout: packages/research
          sparse-checkout-cone-mode: true
      - name: Select pinned Rust
        run: rustup toolchain install 1.90.0 --profile minimal
      - name: Build and test actual workspace
        run: cargo test --workspace --locked
      - name: Retain exact dependency lock
        if: always()
        run: |
          if [ -f Cargo.lock ]; then
            echo REPRODUCIBLE_CARGO_LOCK_BEGIN
            cat Cargo.lock
            echo REPRODUCIBLE_CARGO_LOCK_END
            sha256sum Cargo.lock
          fi
      - name: Check complete registry accounting
        run: |
          mkdir -p build
          cargo run --locked -p research-commons-package -- check > build/coverage.json
          cargo run --locked -p research-commons-package -- prepare > build/preparation.json
          cargo run --locked -p research-commons-package -- prepare-certificates > build/certificate-preparation.json
          cargo run --locked -p research-commons-package -- emit-index > build/Registry.lean
          cmp build/Registry.lean lean/ResearchCommons/Registry.lean
          cargo run --locked -p research-commons-runtime --bin cm-certificate > build/CMExample.lean
          cargo run --locked -p research-commons-runtime --bin affine-certificate -- sat > build/AffineSAT.lean
          cargo run --locked -p research-commons-runtime --bin affine-certificate -- unsat > build/AffineUNSAT.lean
          cargo run --locked -p research-commons-runtime --bin source-certificate -- tree > build/OriginalTreeBank.lean
          cargo run --locked -p research-commons-runtime --bin source-certificate -- parallel > build/OriginalParallelBank.lean
          cargo run --locked -p research-commons-runtime --bin source-certificate -- infeasible > build/OriginalCellExclusion.lean
          cargo run --locked -p research-commons-runtime --bin population-certificate -- edge > build/EdgePopulation.lean
          cargo run --locked -p research-commons-runtime --bin population-certificate -- ancestral > build/AncestralPopulation.lean
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: portable-rust-evidence
          path: |
            packages/research/build/
            !packages/research/build/retained-objects/**
            packages/research/Cargo.lock
          if-no-files-found: warn
  lean:
    concurrency:
      group: portable-research-package-20261023
      cancel-in-progress: false
    name: Coherent retained Lean profile (not all 116 formalizations)
    needs: rust
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        working-directory: packages/research
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          sparse-checkout: packages/research
          sparse-checkout-cone-mode: true
      - name: Select pinned Rust
        run: rustup toolchain install 1.90.0 --profile minimal
      - name: Install pinned Lean on hosted Linux
        run: |
          curl --fail --location --retry 2 --output "$RUNNER_TEMP/lean.tar.zst" https://github.com/leanprover/lean4/releases/download/v4.33.1/lean-4.33.1-linux.tar.zst
          sha256sum "$RUNNER_TEMP/lean.tar.zst"
          echo "890afd185370f85666025b883914ab4f4b339136f8c96167b69cfb62aecaf235  $RUNNER_TEMP/lean.tar.zst" | sha256sum --check
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/lean-4.33.1-linux/bin" >> "$GITHUB_PATH"
      - name: Prepare exact retained sources
        run: cargo run --locked -p research-commons-package -- prepare
      - name: Acquire exact mathlib dependency and cache
        working-directory: packages/research/lean
        run: |
          lake update
          lake exe cache get
      - name: Restore retained-source objects from prior public builds
        id: retained_restore
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: packages/research/build/retained-objects
          key: retained-v1-${{ runner.os }}-${{ hashFiles('packages/research/vendor/accepted/DEPENDENCY-GRAPH.json', 'packages/research/lean/lakefile.lean', 'packages/research/lean/lean-toolchain', 'packages/research/crates/registry/src/object_cache.rs') }}-${{ github.run_id }}-${{ github.job }}
          restore-keys: |
            retained-v1-${{ runner.os }}-${{ hashFiles('packages/research/vendor/accepted/DEPENDENCY-GRAPH.json', 'packages/research/lean/lakefile.lean', 'packages/research/lean/lean-toolchain', 'packages/research/crates/registry/src/object_cache.rs') }}-
      - name: Compile actual module order and aggregate
        run: cargo run --locked -p research-commons-package -- build --reuse-retained
      - name: Kernel-check Rust-emitted positive and negative certificates
        run: cargo run --locked -p research-commons-package -- check-callers
      - name: Retain exact completed source objects even after a later module failure
        if: always() && hashFiles('packages/research/build/retained-objects/manifest.json') != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: packages/research/build/retained-objects
          key: ${{ steps.retained_restore.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: portable-lean-evidence
          path: |
            packages/research/build/
            !packages/research/build/retained-objects/**
            packages/research/lean/.generated/build-plan.json
            packages/research/lean/lake-manifest.json
          if-no-files-found: warn
  certificates:
    name: End-to-end certificate callers (isolated finite-input scope)
    needs: rust
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: packages/research
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          sparse-checkout: packages/research
          sparse-checkout-cone-mode: true
      - name: Select pinned Rust
        run: rustup toolchain install 1.90.0 --profile minimal
      - name: Install the same pinned Lean
        run: |
          curl --fail --location --retry 2 --output "$RUNNER_TEMP/lean.tar.zst" https://github.com/leanprover/lean4/releases/download/v4.33.1/lean-4.33.1-linux.tar.zst
          sha256sum "$RUNNER_TEMP/lean.tar.zst"
          echo "890afd185370f85666025b883914ab4f4b339136f8c96167b69cfb62aecaf235  $RUNNER_TEMP/lean.tar.zst" | sha256sum --check
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/lean-4.33.1-linux/bin" >> "$GITHUB_PATH"
      - name: Prepare exact isolated proof sources
        run: cargo run --locked -p research-commons-package -- prepare-certificates
      - name: Acquire the same exact mathlib
        working-directory: packages/research/certificates
        run: |
          lake update
          lake exe cache get
      - name: Compile core, check actual emitted proofs and audit all owned declarations
        run: cargo run --locked -p research-commons-package -- build-certificates
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: portable-certificate-evidence
          path: |
            packages/research/build/
            !packages/research/build/retained-objects/**
            packages/research/certificates/.generated/build-plan.json
            packages/research/certificates/lake-manifest.json
          if-no-files-found: warn
  source_cells:
    concurrency:
      group: portable-original-source-cell-20261023
      cancel-in-progress: false
    name: Original CHART to actual Lean source and shared physical bank
    needs: rust
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: packages/research
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          sparse-checkout: packages/research
          sparse-checkout-cone-mode: true
      - name: Select pinned Rust
        run: rustup toolchain install 1.90.0 --profile minimal
      - name: Install the same exact Lean compiler
        run: |
          curl --fail --location --retry 2 --output "$RUNNER_TEMP/lean.tar.zst" https://github.com/leanprover/lean4/releases/download/v4.33.1/lean-4.33.1-linux.tar.zst
          echo "890afd185370f85666025b883914ab4f4b339136f8c96167b69cfb62aecaf235  $RUNNER_TEMP/lean.tar.zst" | sha256sum --check
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/lean-4.33.1-linux/bin" >> "$GITHUB_PATH"
      - name: Validate the same complete source graph
        run: cargo run --locked -p research-commons-package -- prepare
      - name: Acquire the same exact Mathlib
        working-directory: packages/research/lean
        run: |
          lake update
          lake exe cache get
      - name: Restore retained-source objects from prior public builds
        id: retained_restore
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: packages/research/build/retained-objects
          key: retained-v1-${{ runner.os }}-${{ hashFiles('packages/research/vendor/accepted/DEPENDENCY-GRAPH.json', 'packages/research/lean/lakefile.lean', 'packages/research/lean/lean-toolchain', 'packages/research/crates/registry/src/object_cache.rs') }}-${{ github.run_id }}-${{ github.job }}
          restore-keys: |
            retained-v1-${{ runner.os }}-${{ hashFiles('packages/research/vendor/accepted/DEPENDENCY-GRAPH.json', 'packages/research/lean/lakefile.lean', 'packages/research/lean/lean-toolchain', 'packages/research/crates/registry/src/object_cache.rs') }}-
      - name: Compile the actual receiver dependency closure in the full package context
        run: cargo run --locked -p research-commons-package -- build --reuse-retained --target OriginalCodeChartReceiver
      - name: Check actual Code fields, returned vectors, physical banks and complete exclusions
        run: cargo run --locked -p research-commons-package -- check-source-callers
      - name: Retain exact completed source objects even after a later module failure
        if: always() && hashFiles('packages/research/build/retained-objects/manifest.json') != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: packages/research/build/retained-objects
          key: ${{ steps.retained_restore.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: portable-original-source-evidence
          path: |
            packages/research/build/
            !packages/research/build/retained-objects/**
            packages/research/lean/.generated/build-plan.json
            packages/research/lean/lake-manifest.json
          if-no-files-found: warn
  population_coefficients:
    concurrency:
      group: portable-population-coefficient-20261023
      cancel-in-progress: false
    name: Retained total population coefficient checker (owned closure)
    needs: rust
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: packages/research
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          sparse-checkout: packages/research
          sparse-checkout-cone-mode: true
      - name: Select pinned Rust
        run: rustup toolchain install 1.90.0 --profile minimal
      - name: Install the same exact Lean compiler
        run: |
          curl --fail --location --retry 2 --output "$RUNNER_TEMP/lean.tar.zst" https://github.com/leanprover/lean4/releases/download/v4.33.1/lean-4.33.1-linux.tar.zst
          echo "890afd185370f85666025b883914ab4f4b339136f8c96167b69cfb62aecaf235  $RUNNER_TEMP/lean.tar.zst" | sha256sum --check
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/lean-4.33.1-linux/bin" >> "$GITHUB_PATH"
      - name: Validate the same complete source graph
        run: cargo run --locked -p research-commons-package -- prepare
      - name: Acquire the same exact Mathlib
        working-directory: packages/research/lean
        run: |
          lake update
          lake exe cache get
      - name: Restore retained-source objects from prior public builds
        id: retained_restore
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: packages/research/build/retained-objects
          key: retained-v1-${{ runner.os }}-${{ hashFiles('packages/research/vendor/accepted/DEPENDENCY-GRAPH.json', 'packages/research/lean/lakefile.lean', 'packages/research/lean/lean-toolchain', 'packages/research/crates/registry/src/object_cache.rs') }}-${{ github.run_id }}-${{ github.job }}
          restore-keys: |
            retained-v1-${{ runner.os }}-${{ hashFiles('packages/research/vendor/accepted/DEPENDENCY-GRAPH.json', 'packages/research/lean/lakefile.lean', 'packages/research/lean/lean-toolchain', 'packages/research/crates/registry/src/object_cache.rs') }}-
      - name: Compile the actual receiver dependency closure in the full package context
        run: cargo run --locked -p research-commons-package -- build --reuse-retained --target ResearchCommons.Integration.Population
      - name: Audit every owned coefficient-checker dependency and declaration
        run: cargo run --locked -p research-commons-package -- audit-target ResearchCommons.Integration.Population
      - name: Check actual native edge and ancestral table exports on the captured original source
        run: cargo run --locked -p research-commons-package -- check-population-callers
      - name: Retain exact completed source objects even after a later module failure
        if: always() && hashFiles('packages/research/build/retained-objects/manifest.json') != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: packages/research/build/retained-objects
          key: ${{ steps.retained_restore.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: portable-population-coefficient-evidence
          path: |
            packages/research/build/
            !packages/research/build/retained-objects/**
            packages/research/lean/.generated/build-plan.json
            packages/research/lean/lake-manifest.json
          if-no-files-found: warn
  completeness:
    name: Full per-claim integration gate
    needs: rust
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/research
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          sparse-checkout: packages/research
          sparse-checkout-cone-mode: true
      - name: Select pinned Rust
        run: rustup toolchain install 1.90.0 --profile minimal
      - name: Reject unbound claims as whole-package completion
        run: cargo run --locked -p research-commons-package -- coverage --strict
