[workspace]
resolver = "2"
members = ["crates/registry", "crates/runtime"]
exclude = ["vendor/g7-source/native/g7-formula"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false

[workspace.dependencies]
serde_json = "=1.0.145"
sha2 = "=0.10.9"

[profile.release]
overflow-checks = true
